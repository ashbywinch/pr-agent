# Build the review image this org runs, from an upstream release plus the
# patches in `patches/`.
#
# The image is the fork's whole point: a Docker action that pulls upstream's
# prebuilt image runs upstream's code and none of the patches. Consumers
# reference `docker://ghcr.io/ashbywinch/pr-agent:github_action`.
#
# The weekly run tries the newest upstream release. If a patch no longer
# applies, THIS run fails and the published tag is not moved — the failure is
# the task to adapt the patch, and consumers keep the last good image.
name: image

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Upstream tag to build from, or 'latest'"
        default: latest
        required: false
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the upstream tag
        id: base
        run: |
          git remote add upstream https://github.com/qodo-ai/pr-agent.git
          git fetch -q --tags --depth 1 upstream
          requested="${{ inputs.base }}"
          if [ -z "$requested" ] || [ "$requested" = "latest" ]; then
            requested=$(git ls-remote --tags --refs upstream \
              | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          echo "tag=$requested" >> "$GITHUB_OUTPUT"
          echo "building $requested"

      - name: Upstream tree plus the patches
        run: |
          tag="${{ steps.base.outputs.tag }}"
          # the patches live on this branch; the checkout below is the upstream
          # tag, which has no patches/ — keep a copy outside the tree
          mkdir -p "$RUNNER_TEMP/patches"
          cp patches/*.patch "$RUNNER_TEMP/patches/"
          git checkout -q -B build "$tag"
          git apply --3way --verbose "$RUNNER_TEMP"/patches/*.patch

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.github_action
          push: true
          # `github_action` moves with each successful build; the versioned tag
          # is what a consumer pins when it wants a fixed image.
          tags: |
            ghcr.io/ashbywinch/pr-agent:github_action
            ghcr.io/ashbywinch/pr-agent:${{ steps.base.outputs.tag }}-repair1
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.base.outputs.tag }}

      - name: The patch no longer applies — say so where it is seen
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="image: the patches do not apply to ${{ steps.base.outputs.tag }}"
          body="The weekly rebuild could not apply \`patches/*.patch\` to \`${{ steps.base.outputs.tag }}\`. The published tag was not moved, so consumers still run the last good image. Adapt the patch in \`patches/\` against that tag, then re-run this workflow."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          # the check ran; the issue is the task. A red schedule every week
          # trains people to ignore it.
          exit 0
